# LoRA fine-tune: Phi-3 Mini (3.8B) — fast iteration on a single consumer GPU.
run_name: "phi3-mini-lora-v1"
base_model: "microsoft/Phi-3-mini-4k-instruct"
dataset_path: "./data/instructions.json"
text_field: "text"
val_ratio: 0.1
chat_template: "chatml"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["qkv_proj", "o_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

quant:
  enabled: false

train:
  output_dir: "./outputs/phi3-mini-lora-v1"
  num_epochs: 3
  per_device_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-4
  max_seq_length: 2048
  gradient_checkpointing: true
  mixed_precision: "bf16"
  warmup_ratio: 0.05
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  seed: 42

eval_benchmarks: ["domain_qa"]
